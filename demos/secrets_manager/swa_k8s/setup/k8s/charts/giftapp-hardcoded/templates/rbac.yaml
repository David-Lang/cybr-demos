# Attack surface 2: SA is granted read access to the Secret via RBAC.
# An attacker with the SA token can call the K8s API to read the secret directly.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-access
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["giftapp-hardcoded-secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-access-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: giftapp-hardcoded-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: secrets-access
  apiGroup: rbac.authorization.k8s.io
