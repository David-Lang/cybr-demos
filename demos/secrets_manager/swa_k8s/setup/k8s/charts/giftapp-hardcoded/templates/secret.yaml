# Attack surface 1: DB creds and API key are stored in this Secret.
# Inside the pod: cat /etc/secrets/* reveals all values in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: giftapp-hardcoded-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "giftapp-hardcoded.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.db.user | quote }}
  DB_PASS: {{ .Values.secrets.db.pass | quote }}
  DB_HOST: mysql-hardcoded.{{ .Release.Namespace }}.svc.cluster.local
  DB_PORT: {{ .Values.secrets.db.port | quote }}
  DB_NAME: {{ .Values.secrets.db.name | quote }}
  GIFTAPP_API_KEY: {{ .Values.secrets.giftappApiKey | quote }}
