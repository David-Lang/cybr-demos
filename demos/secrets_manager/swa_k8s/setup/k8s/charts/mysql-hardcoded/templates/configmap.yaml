apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-hardcoded-initdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mysql-hardcoded.labels" . | nindent 4 }}
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS {{ .Values.mysql.database }};

    GRANT ALL PRIVILEGES ON {{ .Values.mysql.database }}.* TO '{{ .Values.mysql.appUser }}'@'%' IDENTIFIED BY '{{ .Values.mysql.appPassword }}';
    GRANT ALL PRIVILEGES ON {{ .Values.mysql.database }}.* TO '{{ .Values.mysql.appUser }}'@'localhost' IDENTIFIED BY '{{ .Values.mysql.appPassword }}';
    FLUSH PRIVILEGES;

    USE {{ .Values.mysql.database }};

    CREATE TABLE IF NOT EXISTS records (
        id      INT AUTO_INCREMENT PRIMARY KEY,
        first   VARCHAR(30) NOT NULL,
        last    VARCHAR(30) NOT NULL,
        vendor  VARCHAR(30) NOT NULL,
        cardnum VARCHAR(30) NOT NULL,
        balance DECIMAL(10, 2) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS users (
        id       INT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50) NOT NULL UNIQUE,
        password VARCHAR(255) NOT NULL
    );

    INSERT IGNORE INTO users (username, password)
