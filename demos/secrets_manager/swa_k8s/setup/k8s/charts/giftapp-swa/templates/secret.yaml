# Only non-sensitive DB config is stored here — no password, no API key.
apiVersion: v1
kind: Secret
metadata:
  name: giftapp-swa-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "giftapp-swa.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.db.user | quote }}
  DB_HOST: mysql-swa.{{ .Release.Namespace }}.svc.cluster.local
  DB_PORT: {{ .Values.secrets.db.port | quote }}
  DB_NAME: {{ .Values.secrets.db.name | quote }}
