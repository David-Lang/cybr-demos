apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-access
  namespace: sp-sidecar
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-access-binding
  namespace: sp-sidecar
subjects:
  - kind: ServiceAccount
    name: sp-sidecar-sa
    namespace: sp-sidecar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secrets-access
