apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: eso-reloader
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: conjur
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: data/vault/k8s-eso/account-ssh-user-1/username
    - secretKey: password
      remoteRef:
        key: data/vault/k8s-eso/account-ssh-user-1/password
