apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: conjur
  namespace: external-secrets
spec:
  provider:
    conjur:
      url: https://${TENANT_SUBDOMAIN}.secretsmgr.cyberark.cloud/api
      auth:
        jwt:
          account: conjur
          serviceID: ${SM_AUTHN_ID}
          serviceAccountRef:
            name: zg-eso-service-account
            audiences:
              - https://conjur.cyberark.com
