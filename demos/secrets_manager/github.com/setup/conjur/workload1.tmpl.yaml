# metadata
# mode: append-policy
---
# Workload identity for GitHub Actions (workflow + repository claims).
# Identity path data/github-apps matches conjur/authn-jwt/github/identity-path.
# Safe access is granted in github_apps_vault_grant.tmpl.yaml (data root) so
# !group vault/... resolves to data/vault/... instead of data/github-apps/vault/...
- !policy
  id: github-apps
  body:
    - !host
      id: {{ .GITHUB_WORKFLOW }}
      annotations:
        authn-jwt/github/repository: {{ .GITHUB_REPOSITORY }}
        authn-jwt/github/workflow: {{ .GITHUB_WORKFLOW }}
        authn/api-key: true
