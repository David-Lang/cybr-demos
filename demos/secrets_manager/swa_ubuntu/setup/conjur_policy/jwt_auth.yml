# metadata
# mode: append-policy
---
# JWT authenticator for CyberArk Secure Workload Access (SWA)
# Applied to branch: conjur/authn-jwt
- !policy
  id: swa1
  body:
  - !webservice

  # mock mode: public-keys embeds the RSA public key JSON (JWKS format) directly in Conjur.
  # real mode: jwks-uri points to the SWA trust domain OIDC JWKS endpoint.
  # setup.sh sets the appropriate variable based on SWA_MODE; the other is left unset.
  - !variable
    id: public-keys
  - !variable
    id: jwks-uri

  # JWT claim that maps to the Conjur host identity (sub = SPIFFE ID or workload ID).
  - !variable
    id: token-app-property

  # Conjur policy path containing the host identities for this authenticator.
  - !variable
    id: identity-path

  # The expected "iss" claim value in the JWT.
  - !variable
    id: issuer

  # The expected "aud" claim value in the JWT.
  - !variable
    id: audience

  - !group
    id: consumers

  - !permit
    role: !group consumers
    privilege: [ read, authenticate ]
    resource: !webservice

  - !webservice
    id: status
    annotations:
      description: Status check for the SWA JWT authenticator

  - !group
    id: operators

  - !permit
    role: !group operators
    privilege: [ read ]
    resource: !webservice status

  - !grant
    role: !group consumers
    member: !group /data/authenticator/consumers
