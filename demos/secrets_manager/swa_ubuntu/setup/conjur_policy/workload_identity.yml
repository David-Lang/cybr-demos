# metadata
# mode: append-policy
---
# Workload identity for SWA Hello World demo
# Applied to branch: data
#
# Host path: data/workloads/swa/swa-hello-world
# JWT claim: sub = "swa-hello-world"

- !policy
  id: workloads/swa
  body:
  - !host
    id: swa-hello-world
    annotations:
      authn-jwt/swa1/sub: swa-hello-world

- !policy
  id: demo
  body:
  - !variable
    id: db_password

- !grant
  role: !group authenticator/consumers
  member: !host workloads/swa/swa-hello-world

- !permit
  role: !host workloads/swa/swa-hello-world
  privilege: [ read, execute ]
  resource: !variable demo/db_password
