# Post-vault smoke-test secret map used by the demo-root demo.sh.
#
# Points at the account the STUDENT vaults during the activity: safe = the VM
# name, account = postgres-appuser. It only resolves after the student has
# onboarded that account and the workload has been granted read access
# (setup/conjur/grant_consumers.sh). psql reads PGUSER/PGPASSWORD natively.
PGUSER: !var data/vault/{{ SAFE_NAME }}/postgres-appuser/username
PGPASSWORD: !var data/vault/{{ SAFE_NAME }}/postgres-appuser/password
