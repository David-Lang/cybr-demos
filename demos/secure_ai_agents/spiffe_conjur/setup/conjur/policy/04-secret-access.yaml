# Test secret + RBAC for the SPIFFE-attested AI agent demo.
#
# Loaded at branch:  data
# Result:            data/spiffe-secrets/openai-api-key  (the variable)
#                    data/spiffe-secrets/consumers       (the consumer group)
#                    spiffe-apps -> spiffe-secrets/consumers grant
#
# Variable value is set after policy load by setup/conjur/setup.sh from
# DEMO_SECRET_VALUE in setup/vars.env.

- !policy
  id: spiffe-secrets
  body:
    - !variable
      id: openai-api-key
      annotations:
        description: "Vaulted API key consumed by SPIFFE-attested AI agents"
        owner: "cybr-demos secure_ai_agents/spiffe_conjur"

    - !group consumers
    - !permit
        role: !group consumers
        privilege: [ read, execute ]
        resource: !variable openai-api-key

# Make every host in /data/spiffe-apps a consumer of the secret.
- !grant
  role: !group spiffe-secrets/consumers
  member: !group spiffe-apps
